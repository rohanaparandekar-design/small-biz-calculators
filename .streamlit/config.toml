[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F9"
textColor = "#1F2937"
font = "sans serif"
# Body text at 16px; other sizes in app.py are rem, so they scale from this.
baseFontSize = 16
# Keep result numbers large.
metricValueFontSize = "2.25rem"
